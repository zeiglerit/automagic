apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-webserver
  namespace: argocd
spec: 
  project: default
  source: 
    repoURL: https://github.com/zeiglerit/automagic.git
    path: argo/helm/nginx-webserver
    targetRevision: master
  destination: 
    server: https://kubernetes.default.svc
    namespace: nginx-webserver
  syncPolicy: 
    automated: 
      prune: true
      selfHeal: true
