apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginx-webserver.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: 
    matchLabels:
      app: nginx-webserver
  template:
    metadata:
      labels:
        app: nginx-webserver
    spec: 
      containers: 
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: 
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes: 
        - name: html
          configMap:
            name: {{ include "nginx-webserver.fullname" . }}-html
