apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gke
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zeiglerit/automagic.git
    path: argo/helm/nginx-webserver
    targetRevision: HEAD
  destination:
    server: https://34.68.169.3
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
