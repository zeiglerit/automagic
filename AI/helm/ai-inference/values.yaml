replicaCount: 1

image:
  repository: ghcr.io/your-org/ai-inference
  tag: "latest"
  pullPolicy: IfNotPresent

sidecar:
  enabled: true
  image:
    repository: ghcr.io/mlflow/mlflow
    tag: latest
  port: 5000
  env:
    - name: MLFLOW_TRACKING_URI
      value: "http://localhost:5000"
    - name: MLFLOW_ARTIFACT_URI
      value: "/mlflow/artifacts"
  args:
    - "mlflow"
    - "server"
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "5000"
    - "--backend-store-uri"
    - "sqlite:///mlflow.db"
    - "--default-artifact-root"
    - "/mlflow/artifacts"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: "1"
    memory: "2Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"

podAnnotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1001

env:
  - name: MODEL_ID
    value: "meta-llama/Llama-3-8B-Instruct"
  - name: LOG_LEVEL
    value: "info"
